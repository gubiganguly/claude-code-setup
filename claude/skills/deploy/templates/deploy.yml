# ------------------------------------------------------------------------------
# deploy.yml
#
# What it does:
#   Builds the full-stack Next.js app Docker image, pushes it to ECR (tags
#   `:latest` and `:<short-sha>`), then deploys it to the project's Amazon ECS
#   Express Mode service via the official AWS action, which creates-or-updates
#   the service and waits for the deployment to reach a stable state.
#
# When it triggers:
#   - Push to `main` that touches app code, deps, the Dockerfile, or this
#     workflow (production deploys).
#   - `workflow_dispatch` for manual re-deploys.
#
# What it needs (Settings -> Secrets and variables -> Actions -> Variables tab):
#   - AWS_DEPLOY_ROLE_ARN          IAM role ARN (Terraform output
#                                  `github_actions_role_arn`). OIDC-scoped to
#                                  this repo + branch.
#   - AWS_ECS_EXECUTION_ROLE_ARN   Terraform output `execution_role_arn`.
#   - AWS_ECS_INFRA_ROLE_ARN       Terraform output `infra_role_arn`.
#   Repo secrets: none (OIDC means no static AWS keys are stored in GitHub).
#
# Migration note:
#   DB migrations + idempotent seeds run INSIDE the container on boot
#   (docker-entrypoint.sh: `prisma migrate deploy` → seeds → server). This
#   workflow does not run them out-of-band.
# ------------------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "next.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# OIDC requires id-token: write at the workflow (or job) level.
permissions:
  id-token: write
  contents: read

# Serialize deploys on main so two pushes can't race for the same ECS service.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: csip
  ECS_SERVICE_NAME: csip

jobs:
  deploy:
    name: Build, push to ECR, deploy ECS Express
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Distinct session name makes CloudTrail auditing of role assumptions
          # easier to attribute back to a specific workflow run.
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${REGISTRY}/${REPO}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Fargate runs on amd64 — force the platform so a build from an
          # arm64 runner/dev machine still produces a runnable image.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.image_latest }}
            ${{ steps.tags.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Creates the Express service on first run, updates the image on every
      # run after, and waits for the deployment to reach a stable state.
      # Express's UpdateExpressGatewayService is partial — passing only the
      # image leaves env/secrets/sizing (managed by Terraform) untouched.
      - name: Deploy to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_NAME }}
          cluster: default
          image: ${{ steps.tags.outputs.image_sha }}
          execution-role-arn: ${{ vars.AWS_ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.AWS_ECS_INFRA_ROLE_ARN }}
          container-port: "3000"
          health-check-path: /api/health

      - name: Echo deploy result
        run: |
          echo "::notice title=Deploy complete::Image ${{ steps.tags.outputs.image_sha }} live (ECS Express endpoint: ${{ steps.deploy.outputs.endpoint }})"
          echo "Deployed image: ${{ steps.tags.outputs.image_sha }}"
          echo "Express endpoint: ${{ steps.deploy.outputs.endpoint }}"
